[build-system]
requires = ["setuptools==84.0.0", "setuptools-scm==10.3.4"]
build-backend = "setuptools.build_meta"

[project]
name = "software-factory"
dynamic = ["version"]
description = "An evidence-driven task factory for your existing coding agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]
dependencies = []

[project.scripts]
factory = "software_factory.cli:main"

[project.urls]
Repository = "https://github.com/natejswenson/software-factory"

[tool.setuptools.packages.find]
include = ["software_factory*"]
namespaces = false

[tool.setuptools.package-data]
software_factory = ["templates/prd/*.md"]

[tool.setuptools.cmdclass]
build_py = "scripts.build_resources.BuildResources"

[tool.setuptools_scm]
version_file = "software_factory/_version.py"
fallback_version = "0.2.0"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
