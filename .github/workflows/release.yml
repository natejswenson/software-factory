name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: 'Exact main merge commit to release; blank uses the dispatch commit'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: software-factory-release
  cancel-in-progress: false
  queue: max

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      commit: ${{ steps.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - id: prepare
        env:
          RELEASE_COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          python -m scripts.release prepare --commit "$RELEASE_COMMIT" --checkout
      - run: |
          python scripts/verify.py source
          python scripts/verify.py tests
          python -m pip install --no-cache-dir build==1.6.1
          python -m build
          python -m venv "$RUNNER_TEMP/factory-installed"
          "$RUNNER_TEMP/factory-installed/bin/python" -m pip install --no-index --no-deps dist/*.whl
          "$RUNNER_TEMP/factory-installed/bin/python" scripts/smoke_install.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages
          path: dist/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
