name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, 'feature/**', 'bug/**', 'issue/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  checks:
    name: 'checks (${{ matrix.os }}, Python ${{ matrix.python }})'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Require tests in every commit
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python scripts/ci_policy.py --event-file "$GITHUB_EVENT_PATH" --event-name "$EVENT_NAME"
      - run: |
          python scripts/verify.py source
          python scripts/verify.py tests --test-report "$RUNNER_TEMP/passed-tests.json"
      - name: Require associated tests to have passed
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python scripts/ci_policy.py --event-file "$GITHUB_EVENT_PATH" --event-name "$EVENT_NAME" --results "$RUNNER_TEMP/passed-tests.json"
      - run: |
          python -m pip install --no-cache-dir build==1.6.1
          python -m build
          python -m venv "$RUNNER_TEMP/factory-installed"
          "$RUNNER_TEMP/factory-installed/bin/python" -m pip install --no-index --no-deps dist/*.whl
          "$RUNNER_TEMP/factory-installed/bin/python" scripts/smoke_install.py
  test:
    name: test
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          test "$CHECKS_RESULT" = success
